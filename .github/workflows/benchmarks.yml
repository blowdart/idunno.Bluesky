name: Benchmarks

# Full benchmark runs against the checked in corpora. Timings on shared runners are noisy, so this never gates a
# build; allocation regressions are gated by the allocation budget tests which run in CI Build.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  pull_request:
    types: [ labeled, synchronize ]
    branches:
      - 'main'
      - 'dev/*'
      - 'version/*'

permissions:
  contents: read

env:
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  benchmarks:
    name: Run benchmarks
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: 'Checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        persist-credentials: false

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          10.0.x

    - name: 'Report SDK versions'
      run: dotnet --info

    - name: 'Run benchmarks'
      run: dotnet run --configuration Release --project benchmarks/idunno.AtProto.Benchmarks -- --filter '*' --exporters github --artifacts ${{ github.workspace }}/BenchmarkDotNet.Artifacts

    - name: 'Append results to build summary'
      if: always()
      shell: bash
      run: |
        for report in "${GITHUB_WORKSPACE}"/BenchmarkDotNet.Artifacts/results/*-report-github.md; do
          [[ -f "$report" ]] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
        done

    - name: 'Upload benchmark results'
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: benchmark-results
        path: ${{ github.workspace }}/BenchmarkDotNet.Artifacts
        retention-days: 30