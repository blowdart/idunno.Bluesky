name: CI Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'dev/*'
      - 'version/*'
      - 'dependabot/nuget/*'
    paths-ignore:
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches:
      - 'main'
      - 'dev/*'
      - 'version/*'
      - 'dependabot/nuget/*'

permissions:
  contents: read

env:
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TEST_RESULTS: ${{ github.workspace }}/TestResults
  COVERAGE_REPORT: ${{ github.workspace }}/coveragereport

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    environment: cibuild
    permissions:
      contents: read
      issues: read
      pull-requests: write
      checks: write
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: 'Checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        persist-credentials: false
 
    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: | 
          8.0.x
          9.0.x
          10.0.x

    - name: 'Setup Node'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.x'
        package-manager-cache: false

    - name: 'Report SDK versions'
      run : dotnet --info

    - name: 'Build'
      id: build
      run: dotnet build --configuration Debug

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-artifacts
        path: |
          .assets/idunno.*.nupkg
          src/**/idunno.*.dll
          src/**/idunno.*.deps.json
          src/**/idunno.*.xml
        retention-days: 5

    - name: 'Test frontend'
      working-directory: samples/Samples.ReactBff/ClientApp
      run: npm test -- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit="${TEST_RESULTS}/react-bff.junit.xml"

    - name: 'Test'
      id: test
      shell: bash
      run: dotnet test --no-build --no-restore --results-directory "${TEST_RESULTS}" --coverlet --report-xunit-junit --filter-not-class '*AllocationBudgetTests'

    - name: 'Allocation budgets'
      id: allocations
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: |
        set -o pipefail
        diagnostics="${TEST_RESULTS}/allocation-diagnostics"
        mkdir -p "${diagnostics}/measurements"
        dotnet --info > "${diagnostics}/dotnet-info.txt"
        uname -a > "${diagnostics}/system.txt"
        status=0
        for project in idunno.AtProto.Test idunno.Bluesky.Test; do
          for framework in net8.0 net9.0 net10.0; do
            name="${project}.${framework}"
            # Isolate the runtime counter from background GC and coverage instrumentation.
            if env DOTNET_gcConcurrent=0 \
              DOTNET_EnableEventPipe=1 \
              DOTNET_EventPipeConfig=Microsoft-Windows-DotNETRuntime:0x1:5 \
              DOTNET_EventPipeCircularMB=40 \
              DOTNET_EventPipeOutputPath="${diagnostics}/${name}.{pid}.nettrace" \
              IDUNNO_ALLOCATION_REPORT="${diagnostics}/measurements" \
              dotnet "test/${project}/bin/Debug/${framework}/${project}.dll" \
                --filter-class '*AllocationBudgetTests' --parallel none \
                --results-directory "${TEST_RESULTS}" --report-xunit-junit \
                2>&1 | tee "${diagnostics}/${name}.log"; then
              echo "${name}: passed (DOTNET_gcConcurrent=0)" >> "${diagnostics}/summary.txt"
            else
              echo "${name}: failed (DOTNET_gcConcurrent=0)" >> "${diagnostics}/summary.txt"
              status=1
            fi
            traces=("${diagnostics}/${name}".*.nettrace)
            if [[ ! -s "${traces[0]}" ]]; then
              echo "::error::Missing GC trace for ${name}"
              status=1
            fi
          done
        done
        exit "${status}"

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
      if: always()
      with:
        files: ${{ env.TEST_RESULTS }}/*.junit.xml

    - name: Upload Test Artifacts
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results
        path: |
          ${{ env.TEST_RESULTS }}/*.junit.xml
          ${{ env.TEST_RESULTS }}/coverage.cobertura.*.xml
          ${{ env.TEST_RESULTS }}/allocation-diagnostics/
        retention-days: 5

    - name: 'Generate Full Code Coverage Reports'
      uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
      with:
        reports: ${{ env.TEST_RESULTS }}/coverage.cobertura.*.xml
        targetdir: "${{ env.COVERAGE_REPORT }}"
        reporttypes: "Cobertura,MarkdownSummaryGithub"
        verbosity: "Info"
        title: "Code Coverage"
        tag: "${{ github.run_number }}_${{ github.run_id }}"
        toolpath: "reportgeneratortool"
        license: ${{ secrets.REPORT_GENERATOR_LICENSE }}

    - name: Append coverage report to build summary
      shell: bash
      run: cat ${COVERAGE_REPORT}/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: Upload Code Coverage Results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-results
        path: | 
          ${{ env.COVERAGE_REPORT }}
          ${{ env.TEST_RESULTS }}/coverage.cobertura.*.xml
        retention-days: 5

  trimming:
    name: Trimming and AOT
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: 'Checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        persist-credentials: false

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: | 
          8.0.x
          9.0.x
          10.0.x

    - name: 'Cache NuGet packages'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-trimming-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', 'Directory.Build.props', 'src/**/*.props', 'src/**/*.csproj', 'trimming/**/*.props', 'trimming/**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-trimming-

    - name: 'Report SDK versions'
      run : dotnet --info

    # Native AOT needs a platform linker, which the .NET SDK does not carry.
    - name: 'Install native AOT prerequisites'
      run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

    # Whole-assembly analysis covers every package which claims trimming and AOT compatibility. Offline smoke
    # binaries are then run from project references and locally packed NuGet packages, without credentials or
    # network access. RequireNativeBinary makes a missing linker a CI failure rather than a local warning.
    - name: 'Trimming and AOT test'
      id: trimming
      shell: pwsh
      run: ./trimTest.ps1 -Rid linux-x64 -RequireNativeBinary

    - name: Append trimming size report to build summary
      if: always()
      shell: bash
      run: |
        if [[ -f trimming/artifacts/size-report.md ]]; then
          cat trimming/artifacts/size-report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload Trimming Binary Logs
      if: failure() && steps.trimming.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: trimming-binlog
        path: trimming/artifacts/logs/*.binlog
        retention-days: 5
