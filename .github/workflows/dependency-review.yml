name: 'Dependency Review'

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'main'
      - 'version/*'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-licenses: Apache-2.0, MIT, BSD-3-Clause, CC-BY-SA-4.0, LicenseRef-scancode-sonar-sal-1.0, CC-BY-3.0, PostgreSQL
          # Windows-only sample tooling uses Microsoft SDK terms, not an SPDX license.
          # Build-only Python dependencies: certifi uses MPL-2.0; typing-extensions
          # declares PSF-2.0, but its historical license text is misidentified by GitHub.
          # These package-specific exceptions do not bypass vulnerability checks.
          allow-dependencies-licenses: 'pkg:nuget/idunno.AtProto, pkg:nuget/idunno.AtProto.OAuthCallback, pkg:nuget/idunno.AtProto.Types, pkg:nuget/idunno.Bluesky, pkg:nuget/idunno.Bluesky.AspNet.Authentication, pkg:nuget/idunno.Bluesky.AspNet.Authentication.MySQL, pkg:nuget/idunno.Bluesky.AspNet.Authentication.PostgreSQL, pkg:nuget/idunno.Bluesky.AspNet.Authentication.Redis, pkg:nuget/idunno.Bluesky.AspNet.Authentication.SQLite, pkg:nuget/idunno.Bluesky.AspNet.Authentication.UI, pkg:nuget/Microsoft.WindowsAppSDK, pkg:nuget/Microsoft.Windows.SDK.BuildTools, pkg:pypi/certifi, pkg:pypi/typing-extensions'
