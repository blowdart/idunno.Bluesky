name: Publish labeler images
on:
  workflow_call:
    inputs:
      prerelease:
        description: Publish distinct prerelease tags instead of stable release tags
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Publish and sign base, PostgreSQL and MySQL images
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      PRERELEASE: ${{ inputs.prerelease }}
      DOTNET_PROCESSOR_COUNT: 2
      SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-labeler-images.yml@${{ github.ref }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: Checkout Dockerfiles
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        sparse-checkout: |
          src/idunno.Bluesky.Labeler.Host/Dockerfile
          src/idunno.Bluesky.Labeler.Host.PostgreSQL/Dockerfile
          src/idunno.Bluesky.Labeler.Host.MySQL/Dockerfile
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Gather signed labeler payload
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: labeler-payload-signed
        path: ${{ runner.temp }}/labeler-payload

    - name: Install Cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v3.1.4

    - name: Select publication tag
      shell: bash
      run: |
        set -euo pipefail
        if [ "${PRERELEASE}" = true ]; then
          [[ "${GITHUB_REF}" =~ ^refs/heads/version/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#version/}"
          tag="${version}-prerelease-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
        else
          [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="${GITHUB_REF_NAME}"
        fi
        printf 'IMAGE_TAG=%s\nIMAGE_VERSION=%s\nIMAGE_CREATED=%s\n' "${tag}" "$(tr -d '[:space:]' < "${RUNNER_TEMP}/labeler-payload/version.txt")" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: arm64

    - name: Configure image builder
      shell: bash
      run: |
        set -euo pipefail
        docker buildx create --name labeler-images --driver docker-container --use
        docker buildx inspect --bootstrap

    - name: Build, publish, sign and anonymously verify images
      id: images
      shell: bash
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        output="${RUNNER_TEMP}/labeler-images"
        mkdir -p "${output}"
        base=""
        for variant in base postgresql mysql; do
          case "${variant}" in
            base) project=idunno.Bluesky.Labeler.Host ;;
            postgresql) project=idunno.Bluesky.Labeler.Host.PostgreSQL ;;
            mysql) project=idunno.Bluesky.Labeler.Host.MySQL ;;
          esac
          image="ghcr.io/blowdart/idunno-bluesky-labeler-${variant}"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          args=()
          if [ "${variant}" != base ]; then
            args+=(--build-arg "LABELER_BASE=${base}")
          fi
          description="$(sed -n 's/^ *\(LABEL \)\{0,1\} *org\.opencontainers\.image\.description="\(.*\)" *\\$/\2/p' "src/${project}/Dockerfile")"
          [ -n "${description}" ] && [ "${#description}" -le 512 ]
          source="https://github.com/${GITHUB_REPOSITORY}"
          annotations=()
          for level in index manifest; do
            annotations+=(
              --annotation "${level}:org.opencontainers.image.source=${source}"
              --annotation "${level}:org.opencontainers.image.description=${description}"
              --annotation "${level}:org.opencontainers.image.licenses=MIT"
              --annotation "${level}:org.opencontainers.image.revision=${GITHUB_SHA}"
              --annotation "${level}:org.opencontainers.image.version=${IMAGE_VERSION}"
              --annotation "${level}:org.opencontainers.image.created=${IMAGE_CREATED}")
          done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file "src/${project}/Dockerfile" \
            --build-arg IMAGE_SOURCE="${source}" \
            --build-arg IMAGE_REVISION="${GITHUB_SHA}" \
            --build-arg IMAGE_VERSION="${IMAGE_VERSION}" \
            --build-arg IMAGE_CREATED="${IMAGE_CREATED}" \
            "${args[@]}" \
            "${annotations[@]}" \
            --tag "${image}:${IMAGE_TAG}" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            --metadata-file "${output}/${variant}.metadata.json" \
            "${RUNNER_TEMP}/labeler-payload"
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${output}/${variant}.metadata.json")"
          reference="${image}@${digest}"
          # The image must carry the commit and NBGV version the payload was built from, not the inherited base image values.
          docker buildx imagetools inspect --raw "${reference}" | jq -e \
            --arg revision "${GITHUB_SHA}" --arg version "${IMAGE_VERSION}" --arg description "${description}" --arg source "${source}" \
            '.annotations as $a | $a["org.opencontainers.image.revision"] == $revision and $a["org.opencontainers.image.version"] == $version and $a["org.opencontainers.image.description"] == $description and $a["org.opencontainers.image.source"] == $source and $a["org.opencontainers.image.licenses"] == "MIT"' > /dev/null
          docker buildx imagetools inspect --format '{{json .Image}}' "${reference}" | jq -e \
            --arg revision "${GITHUB_SHA}" --arg version "${IMAGE_VERSION}" \
            '[.[] | .config.Labels] | length >= 2 and all(.["org.opencontainers.image.revision"] == $revision and .["org.opencontainers.image.version"] == $version and .["org.opencontainers.image.version"] != "24.04" and .["org.opencontainers.image.licenses"] == "MIT")' > /dev/null
          printf '%s\n' "${reference}" > "${output}/idunno.Bluesky.Labeler.${variant}.image-digest.txt"
          printf '%s=%s\n' "${variant}" "${digest}" >> "${GITHUB_OUTPUT}"
          cosign sign --yes "${reference}"
          anonymous="$(mktemp -d)"
          DOCKER_CONFIG="${anonymous}" docker pull "${reference}"
          DOCKER_CONFIG="${anonymous}" cosign verify \
            --certificate-identity "${SIGNING_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${reference}" > "${output}/${variant}.signature-verification.json"
          rm -rf "${anonymous}"
          docker logout ghcr.io
          if [ "${variant}" = base ]; then base="${reference}"; fi
        done
        printf '%s\n' "${SIGNING_IDENTITY}" > "${output}/signing-identity.txt"
        printf 'Published and verified tag `%s` from commit `%s`.\n' "${IMAGE_TAG}" "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
        cat "${output}"/*.image-digest.txt >> "${GITHUB_STEP_SUMMARY}"

    - name: Authenticate for registry attestations
      shell: bash
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

    - name: Attest immutable digest references
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ runner.temp }}/labeler-images/*.image-digest.txt

    - name: Attest base image
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ghcr.io/blowdart/idunno-bluesky-labeler-base
        subject-digest: ${{ steps.images.outputs.base }}
        push-to-registry: true

    - name: Attest PostgreSQL image
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ghcr.io/blowdart/idunno-bluesky-labeler-postgresql
        subject-digest: ${{ steps.images.outputs.postgresql }}
        push-to-registry: true

    - name: Attest MySQL image
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ghcr.io/blowdart/idunno-bluesky-labeler-mysql
        subject-digest: ${{ steps.images.outputs.mysql }}
        push-to-registry: true

    - name: Verify GitHub image attestations
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        docker logout ghcr.io
        for variant in base postgresql mysql; do
          reference="$(cat "${RUNNER_TEMP}/labeler-images/idunno.Bluesky.Labeler.${variant}.image-digest.txt")"
          gh attestation verify "oci://${reference}" --repo blowdart/idunno.Bluesky
        done

    - name: Upload verified immutable image references
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: labeler-image-digests
        path: ${{ runner.temp }}/labeler-images/
        retention-days: 7
