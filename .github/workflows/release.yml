name: Release
on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOTNET_NOLOGO: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_OUTPUT: ${{ github.workspace}}/nupkgs
  ATTESTATION_INPUT: ${{ github.workspace }}/attestation

permissions:
  contents: read

jobs:
  coherency:
    permissions:
      contents: read

    name: Check coherency
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: Authenticate to GitHub Container Registry
      shell: bash
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

    - name: 'Checkout repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
 
    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: | 
          10.0.x

    - name: 'Check coherence'
      run: dotnet run .build/CoherenceChecks.cs

  build:
    permissions:
      attestations: write
      contents: read
      id-token: write

    name: Build release
    needs: coherency
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    services:
      labeler-postgresql:
        image: postgres:17
        env:
          POSTGRES_USER: labeler_test
          POSTGRES_PASSWORD: labeler-disposable-ci
          POSTGRES_DB: labeler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labeler_test -d labeler_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      labeler-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: labeler-disposable-ci
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysql -h 127.0.0.1 -u root -plabeler-disposable-ci -e 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      LABELER_TEST_POSTGRESQL_CONNECTION: "Host=127.0.0.1;Port=5432;Database=labeler_test;Username=labeler_test;Password=labeler-disposable-ci;Pooling=false;GSS Encryption Mode=Disable"
      LABELER_TEST_MYSQL_CONNECTION: "Server=127.0.0.1;Port=3306;User ID=root;Password=labeler-disposable-ci;Pooling=false"
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: 'Checkout repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so tag validation and nbgv can do their work.
        persist-credentials: false

    - name: "Validate pushed tag"
      uses: lfreleng-actions/tag-validate-action@63470621b8ebc5c4fc86ebb616727dd0a7285dd9 # v1.1.7
      with:
        require_type: semver
        require_signed: ssh
        require_owner: blowdart
        reject_development: true
        token: ${{ secrets.GITHUB_TOKEN }}
 
    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: | 
          8.0.x
          9.0.x
          10.0.x

    - name: 'Setup Node'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.x'
        package-manager-cache: false

    - name: 'Install SBOM tools'
      shell: bash
      run: |
        set -euo pipefail
        dotnet tool restore
        tools="${RUNNER_TEMP}/sbom-tools"
        mkdir -p "${tools}"
        curl --fail --silent --show-error --location --output "${tools}/syft.tar.gz" "https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz"
        echo "bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d  ${tools}/syft.tar.gz" | sha256sum --check -
        tar --extract --gzip --file "${tools}/syft.tar.gz" --directory "${tools}" syft
        curl --fail --silent --show-error --location --output "${tools}/cyclonedx" "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64"
        echo "bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746  ${tools}/cyclonedx" | sha256sum --check -
        chmod +x "${tools}/cyclonedx"
        curl --fail --silent --show-error --location --output "${tools}/spdx-schema.json" "https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json"
        echo "239208b7ac287b3cf5d9a9af23f9d69863971102a5e1587a27a398b43490b89b  ${tools}/spdx-schema.json" | sha256sum --check -
        python3 -m pip install --user --require-hashes -r .build/requirements-sbom.txt
        echo "${tools}" >> "${GITHUB_PATH}"

    - name: 'Generate SBOMs'
      run: dotnet run .build/GenerateSboms.cs -- --public-release true

    - name: 'Validate SBOMs'
      shell: bash
      run: |
        set -euo pipefail
        find src -path '*/obj/sbom/*/bom.cdx.json' -print0 | xargs -0 -n 1 cyclonedx validate --input-format json --fail-on-errors --input-file
        find src -path '*/obj/sbom/*/bom.spdx.json' -print0 | xargs -0 python3 -m check_jsonschema --schemafile "${RUNNER_TEMP}/sbom-tools/spdx-schema.json"

    - name: 'Build'
      run: dotnet build --configuration Release --property:PublicRelease=true

    - name: 'Publish self-contained labeler administration CLI'
      shell: pwsh
      run: |
        $null = New-Item -ItemType Directory -Force -Path $env:BUILD_OUTPUT
        $rids = @('win-x64', 'linux-x64', 'linux-arm64')
        foreach ($rid in $rids) {
          $publishDirectory = Join-Path $env:RUNNER_TEMP "labeler-cli/$rid"
          dotnet publish src/idunno.Bluesky.Labeler.Cli/idunno.Bluesky.Labeler.Cli.csproj `
            --configuration Release `
            --framework net10.0 `
            --runtime $rid `
            --self-contained true `
            --no-restore `
            --output $publishDirectory `
            --property:PublicRelease=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path (Join-Path $publishDirectory '*') `
            -DestinationPath (Join-Path $env:BUILD_OUTPUT "idunno.Bluesky.Labeler.Cli-$rid.zip") `
            -Force
        }

    - name: 'Test frontend'
      working-directory: samples/Samples.ReactBff/ClientApp
      run: npm test

    - name: 'Test'
      run: dotnet test --no-restore --no-build --configuration Release --property:PublicRelease=true

    - name: 'Pack release'
      run: dotnet pack --configuration Release --no-restore --no-build --output ${BUILD_OUTPUT} --property:PublicRelease=true

    - name: 'Extract SBOMs'
      shell: pwsh
      run: |
        Get-ChildItem -Path ${env:BUILD_OUTPUT} -Filter *.nupkg -Force | ForEach-Object {
          $nupkg = $_
          $extracted = Join-Path $env:RUNNER_TEMP $nupkg.BaseName
          Expand-Archive $nupkg.FullName $extracted -Force
          $boms = @(Get-ChildItem -Path (Join-Path $extracted 'sbom') -Recurse -Filter 'bom.*.json')
          if ($boms.Count -eq 0) { throw "$($nupkg.Name) does not contain any SBOMs." }
          # Name each BOM <package>.<version>.<tfm>.cdx.json or <package>.<version>.<tfm>.spdx.json
          $boms | ForEach-Object { Copy-Item $_.FullName "${env:BUILD_OUTPUT}/$($nupkg.BaseName).$($_.Directory.Name).$($_.Name -replace '^bom\.', '')" }
          Remove-Item $extracted -Force -Recurse
        }

    - name: 'Generate release notes'
      shell: pwsh
      run: >
        dotnet run .build/ExtractReleaseNotes.cs --output-file ${env:BUILD_OUTPUT}/release-notes.md

    - name: 'List artifact directory'
      shell: pwsh
      run: >
        Get-ChildItem -Path ${env:BUILD_OUTPUT} -Recurse -Force

    - name: Upload unsigned nupkgs to artifacts
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-artifacts
        path: ${{ env.BUILD_OUTPUT }}/*
        retention-days: 7

  publish-labeler-image:
    name: Publish standalone labeler image
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Authenticate to GitHub Container Registry
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

    - name: Build and publish immutable release image
      shell: bash
      run: |
        set -euo pipefail
        image="ghcr.io/blowdart/idunno-bluesky-labeler"
        metadata="${RUNNER_TEMP}/labeler-image-metadata.json"
        docker buildx build \
          --platform linux/amd64 \
          --file samples/Samples.LabelerHost/Dockerfile \
          --tag "${image}:${GITHUB_REF_NAME}" \
          --provenance=true \
          --sbom=true \
          --push \
          --metadata-file "${metadata}" \
          .
        digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata}")"
        printf '%s@%s\n' "${image}" "${digest}" > "${RUNNER_TEMP}/idunno.Bluesky.Labeler.image-digest.txt"
        docker logout ghcr.io
        docker pull "${image}@${digest}"

    - name: Attest immutable image reference
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ runner.temp }}/idunno.Bluesky.Labeler.image-digest.txt

    - name: Upload immutable image reference
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: labeler-image-digest
        path: ${{ runner.temp }}/idunno.Bluesky.Labeler.image-digest.txt
        retention-days: 7

  sign:
    name: Sign
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
    - name: 'Checkout tool manifest'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        sparse-checkout: |
          .config/dotnet-tools.json
          global.json
          nuget.config
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

    - name: 'Restore .NET tools'
      run: dotnet tool restore

    - name: 'Gather nupkgs from build output'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-artifacts
        path : ${{ env.BUILD_OUTPUT }}

    - name: Authenticate to Azure
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        allow-no-subscriptions : true
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Sign
      shell: pwsh
      run: >
        dotnet tool run sign code azure-key-vault *.nupkg --base-directory ${env:BUILD_OUTPUT} --azure-key-vault-url "${{ secrets.AZURE_KEY_VAULT_URL }}" --azure-key-vault-certificate "${{ secrets.AZURE_KEY_VAULT_CERTIFICATE }}"

    - name: Expand signed nupkg for attestation
      shell: pwsh
      run: | 
        # Create the attestation directory, if it doesn't exist, then delete whatever is in it, just in case.
        New-Item -ItemType Directory -Force -Path ($env:ATTESTATION_INPUT) | Out-Null
        $attestationItems = Get-ChildItem -Path $env:ATTESTATION_INPUT -Force -ErrorAction SilentlyContinue
        if ($attestationItems)
        {
          Remove-Item -Path $attestationItems.FullName -Recurse -Force
        }

        # Build the bits to attest
        Get-ChildItem -Path $env:BUILD_OUTPUT -Filter *.nupkg -Force | ForEach-Object { 
          Copy-Item $_.FullName $($env:ATTESTATION_INPUT)
          Expand-Archive $_.FullName "$($env:ATTESTATION_INPUT)/$($_.Basename)" -Force

          # Place the SBOMs from the nupkg alongside the nupkg for attestation
          $nupkg = $_
          $boms = @(Get-ChildItem -Path "$($env:ATTESTATION_INPUT)/$($nupkg.Basename)/sbom" -Recurse -Filter 'bom.*.json')
          if ($boms.Count -eq 0) { throw "$($nupkg.Name) does not contain any SBOMs." }
          $boms | ForEach-Object { Copy-Item $_.FullName "$($env:ATTESTATION_INPUT)/$($nupkg.Basename).$($_.Directory.Name).$($_.Name -replace '^bom\.', '')" }

          # Remove the extraneous files from the nupkg extraction
          Remove-Item "$($env:ATTESTATION_INPUT)/$($nupkg.Basename)/_rels" -Recurse -Force
          Remove-Item "$($env:ATTESTATION_INPUT)/$($nupkg.Basename)/package" -Recurse -Force
          # Need to special case [Content_Types].xml because of those pesky [] characters
          $contentTypes=Join-Path "$($env:ATTESTATION_INPUT)/$($nupkg.Basename)" -ChildPath "[Content_Types].xml"
          Remove-Item -LiteralPath $contentTypes -Force
        }
        Get-ChildItem -Path $env:BUILD_OUTPUT -Filter '*.zip' -File -Force |
          Copy-Item -Destination $env:ATTESTATION_INPUT

    - name: 'List attestation artifacts'
      shell: pwsh
      run: >
        Get-ChildItem -Path ${env:ATTESTATION_INPUT} -Recurse -Force

    - name: 'Attest artifacts'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{env.ATTESTATION_INPUT}}

    - name: Upload signed nupkgs to artifacts
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: signed-artifacts
        path: ${{env.BUILD_OUTPUT}}/*
        retention-days: 7

  publish:
    name: Publish
    needs: [sign, publish-labeler-image]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

    - name: 'Gather nupkgs from signing output'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: signed-artifacts
        path : ${{ env.BUILD_OUTPUT }}

    - name: 'Gather standalone labeler image digest'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: labeler-image-digest
        path: ${{ env.BUILD_OUTPUT }}

    - name: Authenticate to nuget
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: nugetlogin
      with:
        user: ${{secrets.NUGET_USERNAME}}

      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # This allows a retry of a failed workflow, already published packages will be skipped without error.
    - name: Publish NuGet packages
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.nugetlogin.outputs.NUGET_API_KEY }}
      run: >
        foreach($file in (Get-ChildItem "${env:BUILD_OUTPUT}" -Recurse -Filter *.nupkg)) {
          dotnet nuget push $file --api-key "${env:NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        }

    - name: Setup MyGet and GitHub Packages as NuGet Sources
      shell: pwsh
      run: |
        dotnet new nugetconfig
        dotnet nuget remove source nuget
        dotnet nuget add source https://nuget.pkg.github.com/blowdart/index.json --name github
        dotnet nuget add source https://www.myget.org/F/blowdart/api/v3/index.json --name myget

    - name: Publish NuGet packages to GitHub packages
      shell: pwsh
      run: >
        foreach($file in (Get-ChildItem "${env:BUILD_OUTPUT}" -Recurse -Filter *.nupkg)) {
          dotnet nuget push $file --api-key "${{ secrets.PUBLISH_PACKAGES_PAT }}" --source "github" --skip-duplicate
        }

    - name: Publish NuGet packages to myget
      shell: pwsh
      run: >
        foreach($file in (Get-ChildItem "${env:BUILD_OUTPUT}" -Recurse -Filter *.nupkg)) {
          dotnet nuget push $file --api-key "${{ secrets.MYGET_APIKEY }}" --source "https://www.myget.org/F/blowdart/api/v2/package" --skip-duplicate
        }

  createRelease:
    name: Create Release
    needs: [publish, publish-labeler-image]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      discussions: write
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: 'Gather nupkgs from signing output'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: signed-artifacts
        path : ${{ env.BUILD_OUTPUT }}

    - name: 'Gather standalone labeler image digest'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: labeler-image-digest
        path: ${{ env.BUILD_OUTPUT }}

      # The release is published rather than drafted because the GitHub API ignores
      # discussion_category_name on draft releases, so a drafted release never gets
      # its announcement discussion.
    - name: Create release
      shell: bash
      working-directory: ${{ env.BUILD_OUTPUT }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: >
        gh release create "${RELEASE_TAG}"
        --title "${RELEASE_TAG}"
        --notes-file release-notes.md
        --discussion-category "Announcements"
        --verify-tag
        *.nupkg
        *.image-digest.txt
        *.cdx.json
        *.spdx.json
        *.zip
